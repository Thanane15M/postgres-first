name: Quality gates

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static-quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Install validation dependencies
        run: python -m pip install --requirement requirements-dev.txt
      - name: Validate fenced examples
        run: python scripts/validate_markdown.py
      - name: Validate skill contract and evals
        run: python scripts/validate_skill.py
      - name: Compile deterministic scripts
        run: python -m compileall -q scripts

  postgres-runtime:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: skilltest
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d skilltest"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/skilltest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client
      - name: Execute PostgreSQL runtime smoke
        run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f tests/runtime.sql
      - name: Prove SKIP LOCKED concurrency
        run: bash tests/queue_concurrency.sh "$DATABASE_URL"
